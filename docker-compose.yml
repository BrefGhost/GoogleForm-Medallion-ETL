version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medallion_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

networks:
  default:
    name: medallion_network