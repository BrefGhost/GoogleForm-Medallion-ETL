version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medallion_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bronze:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: python scripts/etl_bronze.py
    depends_on:
      postgres:
        condition: service_healthy

  silver:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: python scripts/etl_silver.py
    depends_on:
      bronze:
        condition: service_completed_successfully

  gold:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: python scripts/etl_gold.py
    depends_on:
      silver:
        condition: service_completed_successfully

networks:
  default:
    name: medallion_network